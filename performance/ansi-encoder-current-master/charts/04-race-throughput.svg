<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
<title id="title">Current-master ANSI encoder race throughput</title>
<desc id="desc">A horizontal bar chart compares aggregate isolated encoder throughput for V1 and V3 in an 800 by 600 stress fixture.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #202428; }
.mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
.title { font-size: 29px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #59636E; }
.panel-title { font-size: 18px; font-weight: 700; }
.label { font-size: 14px; }
.small { font-size: 12px; fill: #59636E; }
.tiny { font-size: 11px; fill: #59636E; }
.metric { font-size: 15px; font-weight: 700; }
</style>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="70.0" y="58.0" class="title">Current-master ANSI encoder race throughput</text>
<text x="70.0" y="87.0" class="subtitle">Higher is better. Aggregate frames divided by aggregate elapsed seconds across two counterbalanced rounds.</text>
<text x="70.0" y="117.0" class="small">This 800x600 virtual fixture is an encoder stress test, not a normal terminal frame rate.</text>
<line x1="250.0" y1="175.0" x2="250.0" y2="515.0" stroke="#D8DDE2"/>
<text x="250.0" y="540.0" class="small" text-anchor="middle">0</text>
<line x1="416.0" y1="175.0" x2="416.0" y2="515.0" stroke="#D8DDE2"/>
<text x="416.0" y="540.0" class="small" text-anchor="middle">25</text>
<line x1="582.0" y1="175.0" x2="582.0" y2="515.0" stroke="#D8DDE2"/>
<text x="582.0" y="540.0" class="small" text-anchor="middle">50</text>
<line x1="748.0" y1="175.0" x2="748.0" y2="515.0" stroke="#D8DDE2"/>
<text x="748.0" y="540.0" class="small" text-anchor="middle">75</text>
<line x1="914.0" y1="175.0" x2="914.0" y2="515.0" stroke="#D8DDE2"/>
<text x="914.0" y="540.0" class="small" text-anchor="middle">100</text>
<line x1="1080.0" y1="175.0" x2="1080.0" y2="515.0" stroke="#D8DDE2"/>
<text x="1080.0" y="540.0" class="small" text-anchor="middle">125</text>
<text x="90.0" y="258.0" class="panel-title mono">V1</text>
<rect x="250" y="220" width="43.1" height="60" rx="5" fill="#5B6573"/>
<text x="308.1" y="258.0" class="metric mono">6.494 FPS</text>
<text x="90.0" y="423.0" class="panel-title mono">V3</text>
<rect x="250" y="385" width="784.9" height="60" rx="5" fill="#1769AA"/>
<text x="1049.9" y="423.0" class="metric mono">118.205 FPS</text>
<text x="70.0" y="595.0" class="metric">Aggregate ratio: 18.20x. Every race output byte count and hash matched.</text>
<text x="70.0" y="625.0" class="small">Two 10-second rounds per revision; order V1/V3, then V3/V1.</text>
